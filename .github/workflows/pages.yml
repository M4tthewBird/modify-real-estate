# Publishes our own pages to GitHub Pages: /stara-sladovna/ and /barak/, built by tools/pages.mjs.
# The copy of the client's site in site/ is not in the repo; only the images these pages use are (git add -f).
name: Pages

on:
  push:
    branches: [main]
    paths: [custom/*/public/**, site/assets/**, tools/pages.mjs, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/pages.mjs "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
