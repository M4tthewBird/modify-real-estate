# Publishes the Barák splat page (custom/barak/public) to GitHub Pages.
# Only this page goes out; the copy of the client's site in site/ is not part of the repo and stays private.
name: Pages

on:
  push:
    branches: [main]
    paths: [custom/barak/public/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: custom/barak/public
      - id: deployment
        uses: actions/deploy-pages@v4
